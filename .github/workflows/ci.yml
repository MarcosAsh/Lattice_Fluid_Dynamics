name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Simulation (C)
    runs-on: ubuntu-24.04
    env:
      MESA_GL_VERSION_OVERRIDE: "4.3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      USE_EGL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev xvfb xauth mesa-utils

      - name: Configure
        run: >
          cmake -G Ninja -B build -S simulation
          -DCMAKE_BUILD_TYPE=Release -DLATTICE_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure -LE validation

  sanitizers:
    name: Simulation (ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libsdl2-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: >
          cmake -G Ninja -B build -S simulation
          -DCMAKE_BUILD_TYPE=Debug -DLATTICE_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -L cpu

  framework:
    name: ML framework (C++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build-ml -S ml -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ml -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-ml --output-on-failure

  python:
    name: Python (lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: >
          uv sync --locked --python 3.12
          --extra torch-cpu --extra anyobj --extra modal

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest

  website:
    name: Website (Next.js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e
