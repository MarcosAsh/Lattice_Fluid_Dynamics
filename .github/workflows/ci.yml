name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulation:
    name: Build simulation (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libsdl2-ttf-dev \
            mesa-common-dev libgl1-mesa-dev libosmesa6-dev \
            libegl1-mesa-dev xvfb mesa-utils

      - name: Configure
        run: cmake -B build -S simulation -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Smoke test
        run: ./build/3d_fluid_simulation_car --help

      - name: Voxelize unit tests
        run: ./build/test_voxelize

      - name: LBM unit tests
        run: |
          export MESA_GL_VERSION_OVERRIDE=4.3
          export LIBGL_ALWAYS_SOFTWARE=1
          export USE_EGL=0
          cd simulation
          xvfb-run ../build/test_lbm

      - name: Integration test
        run: |
          export MESA_GL_VERSION_OVERRIDE=4.3
          export LIBGL_ALWAYS_SOFTWARE=1
          export USE_EGL=0
          cd simulation
          xvfb-run bash test/test_integration.sh

  python:
    name: Python (lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install
        run: >
          uv sync --locked --python 3.12
          --extra torch-cpu --extra anyobj --extra modal

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest

  build-website:
    name: Build website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e
