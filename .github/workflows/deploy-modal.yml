name: Deploy Modal Worker

on:
  push:
    branches: [master]
    paths:
      - 'simulation/modal_worker.py'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy simulation/modal_worker.py
