# Geometry sweep for the any-OBJ Cd/Cl surrogate.
# Run from ml/:  python data_gen.py --config anyobj/sweep.yaml --resume
#
# Adds a spread of generated meshes to the three reference bodies so the
# surrogate sees many distinct geometries, not three. Generate the meshes
# first:  python anyobj/generate_meshes.py
#
# Same physics protocol as the reference sweep (#155): 256x128x128 grid,
# 120 s, single wind speed (Cd at fixed Re is velocity-independent).
#
# Cost: (3 reference + ~12 generated) x 5 Re ~= 75 runs ~= $28 on A100.
# Trim reynolds_numbers or the meshes to spend less.

models:
  - car
  - ahmed25
  - ahmed35

# Every *.obj here is uploaded to the worker as a custom mesh.
meshes_dir: anyobj/meshes

wind_speeds:
  min: 1.0
  max: 1.0
  step: 0.5

reynolds_numbers:
  - 72
  - 144
  - 288
  - 432
  - 576

grid: 256x128x128
duration: 120
viz_mode: 1
collision_mode: 2

dataset_dir: dataset/v2

max_concurrent: 4
retry_limit: 3
delay_between_batches: 2.0

quality:
  cd_max: 15.0
  cd_min: 0.0
  min_cd_samples: 20
  tail_fraction: 0.25
  convergence_threshold: 0.05
